<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- Tank -->
  <g transform="translate(300,235)">
    <rect x="-70" y="-110" width="140" height="220" rx="70" fill="#ffffff" fill-opacity="0.92"/>
    <rect x="-70" y="-30" width="140" height="16" fill="#cbd5e1" opacity="0.7"/>
    <rect x="-24" y="-135" width="48" height="30" rx="8" fill="#e2e8f0"/>
    <circle cx="0" cy="0" r="10" fill="#f97316"/>
  </g>

  <!-- Flame -->
  <g transform="translate(520,255)">
    <path d="M0 -90
             C 35 -60, 45 -20, 20 10
             C 40 0, 55 -20, 55 -40
             C 75 -10, 65 40, 30 65
             C -10 90, -60 70, -65 25
             C -68 -5, -50 -20, -45 -40
             C -40 -15, -25 -5, -20 -15
             C -30 -45, -15 -75, 0 -90 Z"
          fill="#ffffff" fill-opacity="0.95"/>
    <path d="M0 -50
             C 15 -30, 20 -5, 5 15
             C 15 5, 22 -8, 22 -18
             C 32 0, 25 25, 5 35
             C -12 45, -32 32, -33 10
             C -34 -3, -25 -10, -22 -18
             C -18 -6, -10 0, -7 -5
             C -12 -22, -6 -40, 0 -50 Z"
          fill="#f97316"/>
  </g>

  <!-- Pipe connecting -->
  <path d="M 375 300 h 60" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
</svg>
