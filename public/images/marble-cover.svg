<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- Slab -->
  <g transform="translate(400,235)">
    <rect x="-160" y="-95" width="320" height="190" rx="14" fill="#ffffff" fill-opacity="0.94"/>
    <!-- veins -->
    <path d="M -140 -70 C -90 -40, -60 -10, -20 -30 C 20 -50, 50 10, 100 -5 C 130 -15, 150 5, 160 30"
          fill="none" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
    <path d="M -150 20 C -100 40, -50 20, 0 50 C 40 72, 90 55, 150 75"
          fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M -130 -85 C -110 -50, -140 -20, -110 10"
          fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M 90 -80 C 120 -55, 100 -25, 130 5 C 145 20, 140 45, 120 60"
          fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    <rect x="-160" y="-95" width="320" height="190" rx="14" fill="none" stroke="#334155" stroke-opacity="0.15" stroke-width="2"/>
  </g>

  <!-- Polishing sparkle -->
  <g fill="#e0f2fe" opacity="0.9">
    <path d="M 560 130 l 8 20 l 20 8 l -20 8 l -8 20 l -8 -20 l -20 -8 l 20 -8 z"/>
    <circle cx="245" cy="115" r="5"/>
    <circle cx="600" cy="270" r="4"/>
  </g>
</svg>
