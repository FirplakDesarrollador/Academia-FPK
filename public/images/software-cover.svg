<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- Monitor -->
  <g transform="translate(400,220)">
    <rect x="-180" y="-115" width="360" height="230" rx="16" fill="#1e1b4b"/>
    <rect x="-160" y="-95" width="320" height="180" rx="6" fill="#eef2ff"/>
    <rect x="-30" y="115" width="60" height="30" fill="#1e1b4b"/>
    <rect x="-70" y="140" width="140" height="14" rx="7" fill="#1e1b4b"/>

    <!-- Code lines -->
    <g font-family="monospace" font-size="16" fill="#6366f1">
      <text x="-140" y="-55">&lt;/&gt;  módulo.config</text>
      <rect x="-140" y="-35" width="120" height="10" rx="5" fill="#a5b4fc"/>
      <rect x="-140" y="-12" width="200" height="10" rx="5" fill="#c7d2fe"/>
      <rect x="-140" y="11" width="150" height="10" rx="5" fill="#a5b4fc"/>
      <rect x="-140" y="34" width="230" height="10" rx="5" fill="#c7d2fe"/>
      <rect x="-140" y="57" width="90" height="10" rx="5" fill="#a5b4fc"/>
    </g>
  </g>

  <!-- Gear -->
  <g transform="translate(610,140) rotate(15)" fill="#ffffff" opacity="0.9">
    <circle r="34" fill="none" stroke="#ffffff" stroke-width="10"/>
    <circle r="10" fill="#ffffff"/>
    <g stroke="#ffffff" stroke-width="10" stroke-linecap="round">
      <line x1="0" y1="-44" x2="0" y2="-58"/>
      <line x1="0" y1="44" x2="0" y2="58"/>
      <line x1="-44" y1="0" x2="-58" y2="0"/>
      <line x1="44" y1="0" x2="58" y2="0"/>
      <line x1="-31" y1="-31" x2="-41" y2="-41"/>
      <line x1="31" y1="31" x2="41" y2="41"/>
      <line x1="-31" y1="31" x2="-41" y2="41"/>
      <line x1="31" y1="-31" x2="41" y2="-41"/>
    </g>
  </g>
</svg>
