<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#254153"/>
      <stop offset="100%" stop-color="#0f2029"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- Clipboard -->
  <g transform="translate(400,225)">
    <rect x="-110" y="-140" width="220" height="280" rx="18" fill="#ffffff" fill-opacity="0.96"/>
    <rect x="-45" y="-155" width="90" height="34" rx="10" fill="#94a3b8"/>
    <rect x="-45" y="-155" width="90" height="34" rx="10" fill="none" stroke="#64748b" stroke-width="2" opacity="0.4"/>

    <!-- Checklist rows -->
    <g stroke-linecap="round">
      <circle cx="-75" cy="-70" r="15" fill="none" stroke="#22c55e" stroke-width="5"/>
      <path d="M -82 -70 l 5 6 l 10 -12" fill="none" stroke="#22c55e" stroke-width="5"/>
      <rect x="-45" y="-78" width="130" height="14" rx="7" fill="#cbd5e1"/>

      <circle cx="-75" cy="-15" r="15" fill="none" stroke="#22c55e" stroke-width="5"/>
      <path d="M -82 -15 l 5 6 l 10 -12" fill="none" stroke="#22c55e" stroke-width="5"/>
      <rect x="-45" y="-23" width="130" height="14" rx="7" fill="#cbd5e1"/>

      <circle cx="-75" cy="40" r="15" fill="none" stroke="#38bdf8" stroke-width="5"/>
      <rect x="-45" y="32" width="130" height="14" rx="7" fill="#e2e8f0"/>

      <circle cx="-75" cy="95" r="15" fill="none" stroke="#e2e8f0" stroke-width="5"/>
      <rect x="-45" y="87" width="100" height="14" rx="7" fill="#e2e8f0"/>
    </g>
  </g>

  <!-- Floating question mark -->
  <g transform="translate(590,150)" fill="#38bdf8" opacity="0.9">
    <circle r="42" fill="#ffffff" fill-opacity="0.12"/>
    <text x="0" y="16" font-family="Arial, sans-serif" font-size="46" font-weight="700" text-anchor="middle" fill="#ffffff">?</text>
  </g>
</svg>
